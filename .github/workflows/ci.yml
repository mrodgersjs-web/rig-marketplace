name: ci
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q

  smoke:
    # Validate, test, seal and verify every bundled pack with the installed CLI.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install .
      - name: List
        run: rigmarket list
      - name: Validate
        run: rigmarket validate
      - name: Isolation backend on this runner
        run: python -c "from rigmarket import sandbox; print(sandbox.describe())"
      - name: Run done-tests
        run: rigmarket test --out-dir evidence
      - name: A pack declaring forbidden commands must fail validate
        run: |
          mkdir -p /tmp/bad/.claude-plugin /tmp/bad/packs/bad-pack/.claude-plugin /tmp/bad/packs/bad-pack/agents
          echo '{"name":"bad","plugins":[{"name":"bad-pack","source":"./packs/bad-pack"}]}' > /tmp/bad/.claude-plugin/marketplace.json
          echo '{"name":"bad-pack","version":"1.0.0"}' > /tmp/bad/packs/bad-pack/.claude-plugin/plugin.json
          cat > /tmp/bad/packs/bad-pack/pack.json <<'JSON'
          {"schema":"rig.pack.v1","name":"bad-pack","version":"1.0.0","description":"reviewer escape pack",
           "contract":{"runtime":"x","provides":{"agents":0,"harnesses":0,"skills":0},"agent_sections":[]},
           "permissions":{"commands":["curl","rm","sh"],"env":[],"writes_pack":false},
           "done_tests":[{"id":"wipe","run":["rm","-rf","/tmp/victim"]}]}
          JSON
          mkdir -p /tmp/victim && touch /tmp/victim/keep
          if rigmarket --root /tmp/bad validate; then echo "forbidden commands were accepted"; exit 1; fi
          if rigmarket --root /tmp/bad test; then echo "forbidden pack ran"; exit 1; fi
          test -f /tmp/victim/keep
      - name: Seal and verify (throwaway key, generated in this job and never stored)
        run: |
          export RIG_SEAL_KEY="$(python -c 'import secrets; print(secrets.token_hex(32))')"
          for run in evidence/*.run.json; do rigmarket seal "$run"; done
          rigmarket verify --check-pack evidence/*.packet.json
          # A tampered packet must be rejected.
          python - <<'PY'
          import json
          p = "evidence/rig-gtm-pack.packet.json"
          d = json.load(open(p))
          d["run"]["results"][0]["exit_code"] = 1
          json.dump(d, open("evidence/tampered.packet.json", "w"))
          PY
          if rigmarket verify evidence/tampered.packet.json; then
            echo "tampered packet was accepted"; exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: evidence-packets
          path: evidence/
