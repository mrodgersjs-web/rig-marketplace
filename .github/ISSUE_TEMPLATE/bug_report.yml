name: "Bug report"
description: "Reproduce a behavior we should not ship."
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. Please fill in the section below with
        enough detail that a maintainer can reproduce on a fresh clone
        in under 10 minutes. Replace the placeholder text.

  - type: input
    id: rigmarket-version
    attributes:
      label: "rigmarket version"
      description: "The output of `rigmarket --version`."
      placeholder: "1.1.0"
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: "Python version"
      description: "The output of `python3 --version`."
      placeholder: "3.12.3"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: "Operating system"
      description: "macOS, Linux distro, or Windows."
      placeholder: "macOS 14.5"
    validations:
      required: true

  - type: dropdown
    id: command
    attributes:
      label: "Command that misbehaved"
      options:
        - "rigmarket list"
        - "rigmarket validate"
        - "rigmarket test"
        - "rigmarket seal"
        - "rigmarket verify"
        - "other"
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: "Reproduce"
      description: "Exact commands and inputs."
      render: shell
      placeholder: "git clone …\ncd rig-marketplace\npython3 -m venv .venv\n. .venv/bin/activate\npip install -e '.[dev]'\nrigmarket test --out-dir evidence"
    validations:
      required: true

  - type: textarea
    id: observed
    attributes:
      label: "Observed"
      description: "What actually happens. Paste the literal output."
      render: text
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "Expected"
      description: "What you expected to happen instead."
      render: text
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: "Anything else"
      description: "Workarounds, related issues, links."
      render: text
