[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rigmarket"
version = "1.1.0"
description = "Catalog validator for the rig-marketplace agent packs."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Mike Rodgers" }]
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Utilities",
]
dependencies = [
  "PyYAML>=6.0",
  "jsonschema>=4.18",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=4.1",
  "ruff>=0.6.0",
]

[project.urls]
Homepage = "https://github.com/mrodgersjs-web/rig-marketplace"
Repository = "https://github.com/mrodgersjs-web/rig-marketplace"
Issues = "https://github.com/mrodgersjs-web/rig-marketplace/issues"

[project.scripts]
rigmarket = "rigmarket.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rigmarket = ["py.typed"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["packs", "examples", "evidence", "build", ".rig", "mcp"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["src"]
