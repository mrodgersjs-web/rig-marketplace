[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rig-marketplace"
version = "0.2.0"
description = "Plugin-pack format, done-test runner and HMAC-sealed evidence packets for the RIG agent packs."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.18,<5", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
rigmarket = "rigmarket.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rigmarket = ["pack.schema.json"]

[tool.ruff]
line-length = 120
target-version = "py310"
include = ["src/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
